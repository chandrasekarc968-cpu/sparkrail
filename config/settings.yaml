tci:
  weights:
    safety_risk: 0.4
    delay_capacity_impact: 0.3
    degradation_velocity: 0.2
    overdue_penalty: 0.1
  use_xgboost_degradation: true
  # If use_xgboost_degradation is true, this path MUST exist
  xgboost_model_path: ${XGB_MODEL_PATH:models/tci_degradation_xgb.model}
  # Tamper-evident SHA-256 of the trained artifact. Inference is refused if it
  # does not match, so a swapped/retrained model cannot silently change behaviour.
  xgboost_model_checksum: "657009f0034a7c8defbf71e8664ff6910b858ce3c60cfd4ddc4939fe1c736632"

optimization:
  solver: "scip"
  big_m: 100000.0
  time_limit_seconds: 60
  weights:
    tci_completion: 100.0
    closure_time: 1.0
    train_delay: 5.0
  horizon_hours: 24

data_pipeline:
  use_local_synthetic: true
  synthetic_data_path: "data/synthetic"
  kafka:
    bootstrap_servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    topics: ["train_movements", "signal_status"]
  postgis:
    url: ${DATABASE_URL:postgresql://railway_user:password@postgis:5432/railway_db}

simulation:
  use_sumo: false
  sumo_config_path: "sim/railway.sumocfg"
  gui: false

api:
  host: ${API_HOST:0.0.0.0}
  port: ${API_PORT:8000}
  log_level: ${API_LOG_LEVEL:info}
