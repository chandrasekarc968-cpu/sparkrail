name: SparkRail End-to-End Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-verification:
    name: Unmocked End-to-End Integration Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Frontend Dependencies & Playwright
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: Generate Deterministic Test Data
        run: |
          python -m src.cli generate-data --seed 26027

      - name: Start FastAPI in Background
        run: |
          uvicorn src.api.main:app --host 127.0.0.1 --port 8000 > /tmp/sparkrail-api.log 2>&1 &

      - name: Poll FastAPI Health (30s max)
        run: |
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:8000/health > /dev/null; then
              echo "FastAPI backend is healthy!"
              break
            fi
            echo "Waiting for FastAPI to initialize ($i/30)..."
            sleep 1
          done
          if ! curl -s -f http://127.0.0.1:8000/health; then
            echo "ERROR: FastAPI failed to start within 30 seconds. Printing server logs:"
            cat /tmp/sparkrail-api.log
            exit 1
          fi

      - name: Start Frontend in Background (Live API Mode)
        run: |
          cd frontend && VITE_API_BASE_URL=http://127.0.0.1:8000 VITE_DEMO_MODE=false npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/sparkrail-ui.log 2>&1 &

      - name: Poll Frontend UI (30s max)
        run: |
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:5173 > /dev/null; then
              echo "Frontend Vite server is reachable!"
              break
            fi
            echo "Waiting for Vite to start ($i/30)..."
            sleep 1
          done
          if ! curl -s -f http://127.0.0.1:5173; then
            echo "ERROR: Vite frontend failed to start within 30 seconds. Printing UI logs:"
            cat /tmp/sparkrail-ui.log
            exit 1
          fi

      - name: Run Python API-Frontend Contract Tests
        run: |
          pytest -q tests/integration/test_api_frontend_contract.py

      - name: Run Playwright Browser Smoke Test
        run: |
          cd frontend && npm run test:e2e

      - name: Upload Logs and Playwright Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-failure-artifacts
          path: |
            /tmp/sparkrail-api.log
            /tmp/sparkrail-ui.log
            frontend/playwright-report/
            frontend/test-results/
