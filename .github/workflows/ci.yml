name: SparkRail CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security-and-secret-scan:
    name: Secret & Hygiene Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python for Security Audit
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify No Committed Secrets, Credentials or Databases
        run: |
          echo "Scanning for forbidden committed .env files..."
          if [ -f .env ] || [ -f frontend/.env ]; then
            echo "ERROR: Forbidden .env file detected in tracked workspace!"
            exit 1
          fi
          echo "Running repository cleanliness and credential audit..."
          python scripts/audit_git_cleanliness.py
          echo "Hygiene and secret scan passed."

  backend-verification:
    name: Backend Lint, Test & Demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python Syntax Compilation Check
        run: |
          python -m compileall src tests

      - name: Verify Live Mode Remains Disabled by Default
        run: |
          python -c "from src.config import PluginConfig; assert not PluginConfig.is_live_permitted(), 'CRITICAL: Live mode must not be enabled by default in CI!'"

      - name: Run Backend Pytest Suite
        run: |
          pytest -q

      - name: Run End-to-End CLI Demo Pipeline
        run: |
          python -m src.cli demo

      - name: Run Performance Benchmark
        run: |
          python scripts/benchmark.py

  frontend-verification:
    name: Frontend Lint, Typecheck, Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          npm ci

      - name: Lint Frontend
        run: |
          npm run lint

      - name: Typecheck & Build Bundle
        run: |
          npm run build

      - name: Run Frontend Vitest Suite
        run: |
          npm test -- --run

  integration-verification:
    name: Unmocked End-to-End Integration Verification
    runs-on: ubuntu-latest
    needs: [backend-verification, frontend-verification]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Frontend Dependencies & Playwright
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: Generate Deterministic Test Data
        run: |
          python -m src.cli generate-data --seed 26027

      - name: Start FastAPI in Background
        run: |
          uvicorn src.api.main:app --host 127.0.0.1 --port 8000 > /tmp/sparkrail-api.log 2>&1 &

      - name: Poll FastAPI Health (30s max)
        run: |
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:8000/health > /dev/null; then
              echo "FastAPI backend is healthy!"
              break
            fi
            echo "Waiting for FastAPI to initialize ($i/30)..."
            sleep 1
          done
          if ! curl -s -f http://127.0.0.1:8000/health; then
            echo "ERROR: FastAPI failed to start within 30 seconds. Printing server logs:"
            cat /tmp/sparkrail-api.log
            exit 1
          fi

      - name: Start Frontend in Background (Live API Mode)
        run: |
          cd frontend && VITE_API_BASE_URL=http://127.0.0.1:8000 VITE_DEMO_MODE=false npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/sparkrail-ui.log 2>&1 &

      - name: Poll Frontend UI (30s max)
        run: |
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:5173 > /dev/null; then
              echo "Frontend Vite server is reachable!"
              break
            fi
            echo "Waiting for Vite to start ($i/30)..."
            sleep 1
          done
          if ! curl -s -f http://127.0.0.1:5173; then
            echo "ERROR: Vite frontend failed to start within 30 seconds. Printing UI logs:"
            cat /tmp/sparkrail-ui.log
            exit 1
          fi

      - name: Run Python API-Frontend Contract Tests
        run: |
          pytest -q tests/integration/test_api_frontend_contract.py

      - name: Run Playwright Browser Smoke Test
        run: |
          cd frontend && npm run test:e2e

      - name: Upload Logs and Playwright Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-failure-artifacts
          path: |
            /tmp/sparkrail-api.log
            /tmp/sparkrail-ui.log
            frontend/playwright-report/
            frontend/test-results/
