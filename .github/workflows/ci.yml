name: SparkRail CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security-and-secret-scan:
    name: Secret & Hygiene Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify No Committed Secrets or .env Files
        run: |
          echo "Scanning for forbidden committed .env files..."
          if [ -f .env ] || [ -f frontend/.env ]; then
            echo "ERROR: Forbidden .env file detected in tracked workspace!"
            exit 1
          fi
          echo "Scanning for committed bytecode or caches..."
          if find . -name "*.pyc" -o -name "__pycache__" | grep -q .; then
            echo "ERROR: Tracked .pyc or __pycache__ found!"
            exit 1
          fi
          echo "Hygiene scan passed."

  backend-verification:
    name: Backend Lint, Test & Demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python Syntax Compilation Check
        run: |
          python -m compileall src

      - name: Run Backend Pytest Suite
        run: |
          pytest -q

      - name: Run End-to-End CLI Demo Pipeline
        run: |
          python -m src.cli demo

  frontend-verification:
    name: Frontend Lint, Typecheck, Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          npm ci

      - name: Lint Frontend
        run: |
          npm run lint

      - name: Typecheck & Build Bundle
        run: |
          npm run build

      - name: Run Frontend Vitest Suite
        run: |
          npm test -- --run
