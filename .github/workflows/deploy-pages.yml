name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Safety & Unit Tests
        working-directory: ./frontend
        run: npm test -- --run

      - name: Build Static Production Bundle
        working-directory: ./frontend
        env:
          VITE_BASE_PATH: './'
          VITE_DEMO_MODE: 'true'
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -f frontend/dist/index.html || exit 1
          test -f frontend/dist/404.html || exit 1
          echo "Build artifacts verified successfully in frontend/dist"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
